  </g>
  <text class="serif" x="64" y="660" fill="#FFFFFF" font-size="56" font-weight="500" font-style="italic">Casa Mar</text>
  <text class="sans"  x="67" y="696" fill="#EDE6D7" font-size="16" letter-spacing="2">402 m&#178; &#183; 4 SU&#205;TES &#183; 3 VAGAS &#183; PISCINA + ADEGA</text>
  <text class="serif" x="1016" y="690" text-anchor="end" fill="#FFFFFF" font-size="38" font-weight="600" font-style="italic">R$ 11.650.000,00</text>

  <!-- FOTO 2 : CASA BRISA -->
  <g clip-path="url(#clipBrisa)">
