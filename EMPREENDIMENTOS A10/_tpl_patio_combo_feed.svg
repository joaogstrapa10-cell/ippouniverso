  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="#F5F0E8"/>

  <!-- HEADER (marca) -->
  <circle cx="540" cy="58" r="20" fill="none" stroke="#B0894C" stroke-width="2"/>
  <g clip-path="url(#sunClip)" stroke="#B0894C" stroke-width="1.5">
    <line x1="520" y1="49" x2="560" y2="49"/><line x1="520" y1="56" x2="560" y2="56"/>
    <line x1="520" y1="63" x2="560" y2="63"/><line x1="520" y1="70" x2="560" y2="70"/>
  </g>
  <path d="M540,56 C537,62 531,64 526,69 C531,67 535,66 540,65 C545,66 549,67 554,69 C549,64 543,62 540,56 Z" fill="#B0894C"/>
  <text class="sans" x="540" y="110" text-anchor="middle" fill="#2C2A24" font-size="20" letter-spacing="7">P&#193;TIO ESTALEIRO</text>
  <text class="sans" x="540" y="138" text-anchor="middle" fill="#B0894C" font-size="13" letter-spacing="4">DUAS CASAS EXCLUSIVAS &#183; 90 M DO MAR</text>

