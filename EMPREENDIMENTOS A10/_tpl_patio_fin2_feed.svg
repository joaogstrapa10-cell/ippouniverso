<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;display=swap');
      .serif{font-family:'Cormorant Garamond',serif;}
    </style>
    <clipPath id="clipCardA"><rect x="64" y="420" width="464" height="350" rx="18"/></clipPath>
    <clipPath id="clipCardB"><rect x="552" y="420" width="464" height="350" rx="18"/></clipPath>
    <linearGradient id="capFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14120E" stop-opacity="0"/>
      <stop offset="1" stop-color="#14120E" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- base cream -->
  <rect x="0" y="0" width="1080" height="1350" fill="#F5F0E8"/>

  <!-- decorative arcs -->
  <circle cx="1080" cy="110" r="210" fill="none" stroke="#B0894C" stroke-width="1.1" opacity="0.14"/>
  <circle cx="1080" cy="110" r="238" fill="none" stroke="#B0894C" stroke-width="0.7" opacity="0.10"/>

  <!-- HEADLINE -->
  <text class="serif" x="540" y="118" text-anchor="middle" fill="#B0894C" font-size="58" font-weight="600" font-style="italic">Praia do Estaleiro</text>
  <text class="serif" x="540" y="186" text-anchor="middle" fill="#2C2A24" font-size="40" font-weight="600">Pare de comprar na planta.</text>
  <text class="serif" x="540" y="288" text-anchor="middle" fill="#2C2A24" font-size="90" font-weight="600" font-style="italic">Financie sua casa</text>
  <text class="serif" x="540" y="384" text-anchor="middle" fill="#2C2A24" font-size="90" font-weight="600" font-style="italic">pronta, a 90 m do mar.</text>

  <!-- CARD A : CASA MAR -->
  <g clip-path="url(#clipCardA)">
    <image x="64" y="420" width="464" height="350" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,@@MAR@@"/>
    <rect x="64" y="640" width="464" height="130" fill="url(#capFade)"/>
  </g>
  <rect x="64" y="420" width="464" height="350" rx="18" fill="none" stroke="#B0894C" stroke-width="1" opacity="0.5"/>
  <text class="serif" x="92" y="714" fill="#FFFFFF" font-size="40" font-weight="500" font-style="italic">Casa Mar</text>
  <text class="serif" x="94" y="744" fill="#EDE6D7" font-size="14" font-weight="600" letter-spacing="2">402 M&#178; &#183; 4 SU&#205;TES</text>

  <!-- CARD B : CASA BRISA -->
  <g clip-path="url(#clipCardB)">
    <image x="552" y="420" width="464" height="350" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,@@BRISA@@"/>
    <rect x="552" y="640" width="464" height="130" fill="url(#capFade)"/>
  </g>
  <rect x="552" y="420" width="464" height="350" rx="18" fill="none" stroke="#B0894C" stroke-width="1" opacity="0.5"/>
  <text class="serif" x="580" y="714" fill="#FFFFFF" font-size="40" font-weight="500" font-style="italic">Casa Brisa</text>
  <text class="serif" x="582" y="744" fill="#EDE6D7" font-size="14" font-weight="600" letter-spacing="2">350 M&#178; &#183; 5 SU&#205;TES</text>

  <!-- CTA -->
  <rect x="280" y="794" width="520" height="64" rx="32" fill="#B0894C"/>
  <text class="serif" x="540" y="836" text-anchor="middle" fill="#2C2A24" font-size="25" font-weight="600" letter-spacing="4">CONHE&#199;A AS CONDI&#199;&#213;ES</text>

  <!-- DARK PANEL -->
  <rect x="0" y="886" width="1080" height="464" fill="#26231D"/>

  <!-- OUTER FRAME -->
  <rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#B0894C" stroke-width="1.3" opacity="0.85"/>
  <rect x="29" y="29" width="1022" height="1292" fill="none" stroke="#B0894C" stroke-width="0.6" opacity="0.45"/>

  <!-- PANEL HEADER -->
  <text class="serif" x="540" y="948" text-anchor="middle" fill="#B0894C" font-size="26" font-weight="600" letter-spacing="6">CONDI&#199;&#195;O ESPECIAL DE PAGAMENTO</text>

  <!-- STAT CARDS -->
  <rect x="64" y="980" width="464" height="128" rx="14" fill="none" stroke="#B0894C" stroke-width="1" opacity="0.38"/>
  <text class="serif" x="100" y="1028" fill="#B0894C" font-size="15" font-weight="600" letter-spacing="3">ENTRADA</text>
  <text class="serif" x="100" y="1082" fill="#F5F0E8" font-size="44" font-weight="600">60%</text>

  <rect x="552" y="980" width="464" height="128" rx="14" fill="none" stroke="#B0894C" stroke-width="1" opacity="0.38"/>
  <text class="serif" x="588" y="1028" fill="#B0894C" font-size="15" font-weight="600" letter-spacing="3">SALDO EM AT&#201;</text>
  <text class="serif" x="588" y="1082" fill="#F5F0E8" font-size="44" font-weight="600">180 meses</text>

  <rect x="64" y="1128" width="464" height="128" rx="14" fill="none" stroke="#B0894C" stroke-width="1" opacity="0.38"/>
  <text class="serif" x="100" y="1176" fill="#B0894C" font-size="15" font-weight="600" letter-spacing="3">ENTRADA FLEX&#205;VEL</text>
  <text class="serif" x="100" y="1230" fill="#F5F0E8" font-size="44" font-weight="600">Dinheiro ou im&#243;vel</text>

  <!-- LOGO CELL -->
  <image x="699" y="1138" width="170" height="109" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,@@LOGO@@"/>

  <!-- FOOTER -->
  <text class="serif" x="540" y="1292" text-anchor="middle" fill="#8C8273" font-size="13" font-weight="600" letter-spacing="2">EM PARCERIA COM INSTITUI&#199;&#195;O FINANCEIRA &#183; SUJEITO A AN&#193;LISE E APROVA&#199;&#195;O DE CR&#201;DITO</text>
  <text class="serif" x="540" y="1316" text-anchor="middle" fill="#8C8273" font-size="13" font-weight="600" letter-spacing="3">PRAIA DO ESTALEIRO &#183; BALNE&#193;RIO CAMBORI&#218;/SC &#183; A10 &#215; R21</text>
</svg>
