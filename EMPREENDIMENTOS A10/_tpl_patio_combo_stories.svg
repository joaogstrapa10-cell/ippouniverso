<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;family=Jost:wght@300;400;500&amp;display=swap');
      .serif{font-family:'Cormorant Garamond',serif;}
      .sans{font-family:'Jost','Poppins',sans-serif;}
    </style>
    <clipPath id="clipMar"><rect x="0" y="160" width="1080" height="720"/></clipPath>
    <clipPath id="clipBrisa"><rect x="0" y="880" width="1080" height="720"/></clipPath>
    <clipPath id="sunClip"><circle cx="540" cy="70" r="22"/></clipPath>
    <linearGradient id="capFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14120E" stop-opacity="0"/>
      <stop offset="1" stop-color="#14120E" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1920" fill="#F5F0E8"/>

  <!-- HEADER (marca) -->
  <circle cx="540" cy="70" r="22" fill="none" stroke="#B0894C" stroke-width="2"/>
  <g clip-path="url(#sunClip)" stroke="#B0894C" stroke-width="1.6">
    <line x1="518" y1="60" x2="562" y2="60"/><line x1="518" y1="67" x2="562" y2="67"/>
    <line x1="518" y1="74" x2="562" y2="74"/><line x1="518" y1="81" x2="562" y2="81"/>
  </g>
  <path d="M540,68 C537,74 530,76 525,82 C530,80 535,79 540,78 C545,79 550,80 555,82 C550,76 543,74 540,68 Z" fill="#B0894C"/>
  <text class="sans" x="540" y="124" text-anchor="middle" fill="#2C2A24" font-size="22" letter-spacing="8">P&#193;TIO ESTALEIRO</text>

  <!-- FOTO 1 : CASA MAR -->
  <g clip-path="url(#clipMar)">
    <image x="0" y="160" width="1080" height="720" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,__IMG1__"/>
    <rect x="0" y="700" width="1080" height="180" fill="url(#capFade)"/>
  </g>
  <text class="serif" x="64" y="816" fill="#FFFFFF" font-size="64" font-weight="500" font-style="italic">Casa Mar</text>
  <text class="sans"  x="67" y="854" fill="#EDE6D7" font-size="18" letter-spacing="2">402 m&#178; &#183; 4 SU&#205;TES &#183; 3 VAGAS &#183; PISCINA + ADEGA</text>
  <text class="serif" x="1016" y="848" text-anchor="end" fill="#FFFFFF" font-size="44" font-weight="600" font-style="italic">R$ 11.650.000,00</text>

  <!-- FOTO 2 : CASA BRISA -->
  <g clip-path="url(#clipBrisa)">
    <image x="0" y="880" width="1080" height="720" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,__IMG2__"/>
    <rect x="0" y="1420" width="1080" height="180" fill="url(#capFade)"/>
  </g>
  <text class="serif" x="64" y="1536" fill="#FFFFFF" font-size="64" font-weight="500" font-style="italic">Casa Brisa</text>
  <text class="sans"  x="67" y="1574" fill="#EDE6D7" font-size="18" letter-spacing="2">350 m&#178; &#183; 5 SU&#205;TES &#183; 3 VAGAS &#183; PISCINA PRIVATIVA</text>
  <text class="serif" x="1016" y="1568" text-anchor="end" fill="#FFFFFF" font-size="44" font-weight="600" font-style="italic">R$ 6.890.000,00</text>

  <!-- FOOTER -->
  <text class="serif" x="540" y="1700" text-anchor="middle" fill="#2C2A24" font-size="46" font-style="italic">Duas casas exclusivas &#8212; a 90 m do mar</text>
  <text class="sans" x="540" y="1752" text-anchor="middle" fill="#8C8273" font-size="15" letter-spacing="3">PRAIA DO ESTALEIRO &#183; BALNE&#193;RIO CAMBORI&#218;/SC &#183; A10 &#215; R21</text>

  <!-- OUTER FRAME -->
  <rect x="24" y="24" width="1032" height="1872" fill="none" stroke="#B0894C" stroke-width="1.3" opacity="0.85"/>
</svg>
