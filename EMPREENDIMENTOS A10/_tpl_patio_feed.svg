<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;family=Jost:wght@300;400;500&amp;display=swap');
      .serif{font-family:'Cormorant Garamond',serif;}
      .sans{font-family:'Jost','Poppins',sans-serif;}
    </style>
    <clipPath id="photoClip"><rect x="0" y="0" width="1080" height="768"/></clipPath>
    <clipPath id="sunClip"><circle cx="540" cy="62" r="22"/></clipPath>
    <linearGradient id="topScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14120E" stop-opacity="0.50"/>
      <stop offset="0.28" stop-color="#14120E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="botFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F0E8" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#F5F0E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5F0E8" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- base cream -->
  <rect x="0" y="0" width="1080" height="1350" fill="#F5F0E8"/>

  <!-- PHOTO -->
  <g clip-path="url(#photoClip)">
    <image x="0" y="0" width="1080" height="768" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,__IMG__"/>
    <rect x="0" y="0" width="1080" height="768" fill="url(#topScrim)"/>
    <rect x="0" y="468" width="1080" height="300" fill="url(#botFade)"/>
  </g>

  <!-- BRAND MARK (whale + sunset) over photo -->
  <g>
    <circle cx="540" cy="62" r="22" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <g clip-path="url(#sunClip)" stroke="#FFFFFF" stroke-width="1.6">
      <line x1="518" y1="51" x2="562" y2="51"/>
      <line x1="518" y1="58" x2="562" y2="58"/>
      <line x1="518" y1="65" x2="562" y2="65"/>
      <line x1="518" y1="72" x2="562" y2="72"/>
    </g>
    <path d="M540,60 C537,66 531,68 526,73 C531,71 535,70 540,69 C545,70 549,71 554,73 C549,68 543,66 540,60 Z" fill="#FFFFFF"/>
  </g>
  <text class="sans" x="540" y="116" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="400" letter-spacing="7">P&#193;TIO ESTALEIRO</text>

  <!-- OUTER FRAME -->
  <rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#B0894C" stroke-width="1.3" opacity="0.85"/>
  <rect x="29" y="29" width="1022" height="1292" fill="none" stroke="#B0894C" stroke-width="0.6" opacity="0.45"/>

  <!-- CASA label -->
  <text class="sans" x="540" y="846" text-anchor="middle" fill="#B0894C" font-size="23" font-weight="400" letter-spacing="10">C A S A</text>
  <!-- NAME -->
  <text class="serif" x="540" y="938" text-anchor="middle" fill="#2C2A24" font-size="92" font-weight="500" font-style="italic">__NAME__</text>
  <line x1="500" y1="966" x2="580" y2="966" stroke="#B0894C" stroke-width="1.4"/>

  <!-- SPECS (3 cols) -->
  <g>
    <line x1="405" y1="1018" x2="405" y2="1086" stroke="#B0894C" stroke-width="0.8" opacity="0.5"/>
    <line x1="675" y1="1018" x2="675" y2="1086" stroke="#B0894C" stroke-width="0.8" opacity="0.5"/>
    <text class="serif" x="270" y="1062" text-anchor="middle" fill="#2C2A24" font-size="46" font-weight="500">__AREA__ m&#178;</text>
    <text class="sans"  x="270" y="1092" text-anchor="middle" fill="#8C8273" font-size="14" letter-spacing="3">&#193;REA TOTAL</text>
    <text class="serif" x="540" y="1062" text-anchor="middle" fill="#2C2A24" font-size="46" font-weight="500">__SUITES__</text>
    <text class="sans"  x="540" y="1092" text-anchor="middle" fill="#8C8273" font-size="14" letter-spacing="3">SU&#205;TES</text>
    <text class="serif" x="810" y="1062" text-anchor="middle" fill="#2C2A24" font-size="46" font-weight="500">3</text>
    <text class="sans"  x="810" y="1092" text-anchor="middle" fill="#8C8273" font-size="14" letter-spacing="3">VAGAS</text>
  </g>

  <!-- AMENITIES -->
  <text class="sans" x="540" y="1150" text-anchor="middle" fill="#6E665A" font-size="16" letter-spacing="2.5">Living &#183; Cozinha &#183; Deck &#183; Piscina privativa &#8212; integrados</text>

  <line x1="480" y1="1192" x2="600" y2="1192" stroke="#B0894C" stroke-width="0.8" opacity="0.55"/>

  <!-- PRICE -->
  <text class="sans" x="540" y="1232" text-anchor="middle" fill="#B0894C" font-size="14" letter-spacing="6">INVESTIMENTO</text>
  <text class="serif" x="540" y="1288" text-anchor="middle" fill="#2C2A24" font-size="50" font-weight="600" font-style="italic">R$ __PRICE__</text>

  <!-- ADDRESS + BRAND -->
  <text class="sans" x="540" y="1322" text-anchor="middle" fill="#8C8273" font-size="13" letter-spacing="3">PRAIA DO ESTALEIRO &#183; BALNE&#193;RIO CAMBORI&#218;/SC &#183; 90 M DO MAR &#183; A10 &#215; R21</text>
</svg>
