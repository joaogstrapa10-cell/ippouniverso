<text font-family="Cormorant Garamond" x="78" y="1288" font-size="40" font-style="italic" font-weight="600" fill="#FFFFFF">__PRICE__</text>

<!-- ADDRESS (right) -->
<text text-anchor="end" font-family="Poppins" x="1002" y="1238" font-size="13" font-weight="500" fill="__ACC__" letter-spacing="3">ENDEREÇO</text>
<text text-anchor="end" font-family="Poppins" x="1002" y="1270" font-size="20" font-weight="600" fill="#FFFFFF">__ADDR1__</text>
<text text-anchor="end" font-family="Poppins" x="1002" y="1296" font-size="15" font-weight="400" fill="#FFFFFF" fill-opacity="0.72">__ADDR2__</text>

