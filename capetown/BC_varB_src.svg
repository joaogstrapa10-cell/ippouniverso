<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Poppins:wght@300;400;500;600&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans  { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <linearGradient id="topscrim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="300">
      <stop offset="0" stop-color="#070B0A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#070B0A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="botscrim" gradientUnits="userSpaceOnUse" x1="0" y1="760" x2="0" y2="1350">
      <stop offset="0"   stop-color="#070B0A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#08100E" stop-opacity="0.78"/>
      <stop offset="1"   stop-color="#060A09" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="txtSh" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <image id="foto" x="0" y="0" width="1080" height="1350"
         xlink:href="data:image/jpeg;base64,__BC__" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="300" fill="url(#topscrim)"/>
  <rect width="1080" height="1350" fill="url(#botscrim)"/>

  <image x="430" y="78" width="220" height="86"
         xlink:href="data:image/png;base64,__A10__" preserveAspectRatio="xMidYMid meet"/>

  <g filter="url(#txtSh)">
    <text class="sans"  x="540" y="982"  text-anchor="middle" fill="#E0C079" font-size="23" font-weight="400" letter-spacing="9">INVISTA EM</text>
    <text class="serif" x="540" y="1086" text-anchor="middle" fill="#F4EFE7" font-size="86" font-weight="600" letter-spacing="1">Balne&#225;rio Cambori&#250;</text>
  </g>
  <line x1="476" y1="1126" x2="604" y2="1126" stroke="#C9A86A" stroke-width="1.3" stroke-opacity="0.85"/>

  <text class="sans" x="540" y="1188" text-anchor="middle" fill="#EDE6D8" font-size="25" font-weight="300" filter="url(#txtSh)"><tspan fill="#E6C77E" font-weight="600">20%</tspan> de resultado comprovado</text>
  <text class="sans" x="540" y="1216" text-anchor="middle" fill="#B9B3A6" font-size="16" font-weight="300">m&#233;dia hist&#243;rica de valoriza&#231;&#227;o do m&#178; &#183; rentabilidade passada n&#227;o garante futura</text>

  <rect x="324" y="1252" width="432" height="74" rx="37" fill="#C9A86A" fill-opacity="0.08" stroke="#C9A86A" stroke-width="1.6"/>
  <text class="sans" x="540" y="1297" text-anchor="middle" fill="#F4EFE7" font-size="23" font-weight="500" letter-spacing="3">FALAR COM ESPECIALISTA&#160;&#160;&#8250;</text>
</svg>
