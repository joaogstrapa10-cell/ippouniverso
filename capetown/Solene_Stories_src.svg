<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Poppins:wght@300;400;500;600&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans  { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1B1611"/>
      <stop offset="0.45" stop-color="#15110C"/>
      <stop offset="1"    stop-color="#0C0906"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.55">
      <stop offset="0"   stop-color="#C6AD6E" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#C6AD6E" stop-opacity="0.04"/>
      <stop offset="1"   stop-color="#C6AD6E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="footScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0906" stop-opacity="0"/>
      <stop offset="1" stop-color="#0C0906" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect x="120" y="560" width="840" height="1200" fill="url(#glow)"/>

  <!-- hero tower (editable layer: foto) -->
  <image id="foto" x="277" y="762" width="526" height="1118"
         xlink:href="data:image/png;base64,__SOLENE__" preserveAspectRatio="xMidYMax meet"/>

  <!-- footer scrim + contact -->
  <rect x="36" y="1700" width="1008" height="184" fill="url(#footScrim)"/>
  <text class="sans" x="540" y="1846" text-anchor="middle" fill="#C6AD6E"
        font-size="21" font-weight="400" letter-spacing="5" fill-opacity="0.92">A10EMPREENDIMENTOS.COM.BR</text>

  <!-- double gold frame (luxe) -->
  <rect x="36"  y="36"  width="1008" height="1848" fill="none" stroke="#C6AD6E" stroke-width="1.6" stroke-opacity="0.55"/>
  <rect x="49"  y="49"  width="982"  height="1822" fill="none" stroke="#C6AD6E" stroke-width="1"   stroke-opacity="0.28"/>

  <!-- A10 logo -->
  <image x="390" y="100" width="300" height="118"
         xlink:href="data:image/png;base64,__A10__" preserveAspectRatio="xMidYMid meet"/>

  <!-- kicker -->
  <text class="sans" x="540" y="284" text-anchor="middle" fill="#C6AD6E"
        font-size="20" font-weight="400" letter-spacing="7">INCORPORA&#199;&#195;O DE ALTO PADR&#195;O</text>

  <!-- headline -->
  <text class="serif" x="540" y="372" text-anchor="middle" fill="#F3ECDE"
        font-size="68" font-weight="500" letter-spacing="3">INVISTA NO</text>
  <text class="serif" x="540" y="508" text-anchor="middle" fill="#C6AD6E"
        font-size="150" font-weight="600" letter-spacing="6">SOLENE</text>

  <!-- rule -->
  <line x1="470" y1="548" x2="610" y2="548" stroke="#C6AD6E" stroke-width="1.4" stroke-opacity="0.8"/>

  <!-- subtitle -->
  <text class="sans" x="540" y="606" text-anchor="middle" fill="#DCD2C1"
        font-size="25" font-weight="300" letter-spacing="0.5">Arquitetura atemporal e sofistica&#231;&#227;o contempor&#226;nea</text>
  <text class="sans" x="540" y="642" text-anchor="middle" fill="#DCD2C1"
        font-size="25" font-weight="300" letter-spacing="0.5">no endere&#231;o mais desejado da cidade.</text>

  <!-- CTA pill -->
  <g>
    <rect x="330" y="690" width="420" height="76" rx="38" fill="#C6AD6E"/>
    <text class="sans" x="540" y="737" text-anchor="middle" fill="#14110D"
          font-size="24" font-weight="600" letter-spacing="3">AGENDE SUA VISITA&#160;&#160;&#8250;</text>
  </g>
</svg>
