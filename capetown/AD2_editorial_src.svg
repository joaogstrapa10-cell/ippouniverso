<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style type="text/css">
      @font-face{font-family:'Bodoni';src:url(data:font/ttf;base64,__FONT_BODONI__) format('truetype');font-weight:400 900;}
      @font-face{font-family:'BodoniIt';src:url(data:font/ttf;base64,__FONT_BODONI_IT__) format('truetype');font-weight:400 900;font-style:italic;}
      @font-face{font-family:'Poppins';font-weight:400;src:url(data:font/ttf;base64,__FONT_REG__) format('truetype');}
      @font-face{font-family:'Poppins';font-weight:600;src:url(data:font/ttf;base64,__FONT_SEMI__) format('truetype');}
      .mono{font-family:'Bodoni',serif;font-weight:600;font-variation-settings:'opsz' 96;}
      .ital{font-family:'BodoniIt',serif;font-weight:500;font-style:italic;font-variation-settings:'opsz' 96;}
      .semi{font-family:'Poppins',sans-serif;font-weight:600;}
    </style>
    <clipPath id="ph"><rect x="50" y="60" width="980" height="780"/></clipPath>
    <clipPath id="ava2"><circle cx="413" cy="1175" r="22"/></clipPath>
  </defs>

  <!-- fundo creme -->
  <rect width="1080" height="1350" fill="#F5F0EA"/>

  <!-- moldura keyline fina -->
  <rect x="26" y="26" width="1028" height="1298" fill="none" stroke="#C9B4A8" stroke-width="1" stroke-opacity="0.7"/>

  <!-- foto antes/depois (faixa grande no topo) -->
  <g clip-path="url(#ph)">
    <image x="50" y="60" width="980" height="780" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,__IMG__"/>
  </g>
  <rect x="50" y="60" width="980" height="780" fill="none" stroke="#C9B4A8" stroke-width="1" stroke-opacity="0.8"/>

  <!-- labels antes / depois -->
  <text class="semi" font-size="15" fill="#7A5C50" text-anchor="middle" letter-spacing="4"><tspan x="295" y="888">ANTES</tspan></text>
  <text class="semi" font-size="15" fill="#7A5C50" text-anchor="middle" letter-spacing="4"><tspan x="785" y="888">DEPOIS</tspan></text>

  <!-- marca: logo FA oficial (recolorida preta, fundo transparente) -->
  <image x="482" y="912" width="117" height="80" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,__LOGO__"/>

  <!-- frase editorial -->
  <text class="ital" font-size="42" fill="#3D2420" text-anchor="middle"><tspan x="540" y="1050">Realce na medida certa.</tspan></text>

  <!-- barra do @ (modelo Instagram) -->
  <g>
    <rect x="373" y="1145" width="334" height="60" rx="30" fill="#FFFFFF" fill-opacity="0.9" stroke="#E0D2C8" stroke-width="1"/>
    <circle cx="413" cy="1175" r="22" fill="#E8DDD4"/>
    <image clip-path="url(#ava2)" x="391" y="1153" width="44" height="44" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/png;base64,__AVATAR__"/>
    <circle cx="413" cy="1175" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text class="semi" font-size="20" fill="#2A1C18"><tspan x="447" y="1182">drafrancinealmeida</tspan></text>
    <circle cx="678" cy="1175" r="11" fill="#3897F0"/>
    <path d="M673 1175 l3.4 3.4 l6 -6.6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
