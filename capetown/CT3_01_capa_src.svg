<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style type="text/css">
      @font-face{font-family:'Playfair';src:url(data:font/ttf;base64,__FONT_SERIF__) format('truetype');font-weight:400 900;}
      @font-face{font-family:'Poppins';font-weight:400;src:url(data:font/ttf;base64,__FONT_REG__) format('truetype');}
      @font-face{font-family:'Poppins';font-weight:600;src:url(data:font/ttf;base64,__FONT_SEMI__) format('truetype');}
      .serif{font-family:'Playfair',serif;font-weight:700;}
      .reg{font-family:'Poppins',sans-serif;font-weight:400;}
      .semi{font-family:'Poppins',sans-serif;font-weight:600;}
    </style>
    <clipPath id="imgClip"><rect x="0" y="560" width="1080" height="790"/></clipPath>
    <linearGradient id="imgBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0.7" stop-color="#10100F" stop-opacity="0"/><stop offset="1" stop-color="#10100F" stop-opacity="0.6"/></linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="#F2EDE6"/>

  <!-- imagem -->
  <g clip-path="url(#imgClip)">
    <image x="0" y="555" width="1080" height="800" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,__IMG_1__"/>
    <rect x="0" y="560" width="1080" height="790" fill="url(#imgBot)"/>
  </g>

  <!-- topo -->
  <text class="semi" font-size="15" letter-spacing="2" fill="#A8967F"><tspan x="62" y="62">DRA. FRANCINE ALMEIDA</tspan><tspan class="reg" fill="#B9AB98"> · HARMONIZAÇÃO FACIAL</tspan></text>
  <rect x="940" y="42" width="80" height="34" rx="17" fill="#DBD3C8"/>
  <text class="semi" font-size="16" letter-spacing="1" fill="#6E6258" text-anchor="middle"><tspan x="980" y="65">1 / 7</tspan></text>

  <!-- título serifado + barra de destaque -->
  <text class="serif" font-size="120" fill="#8A6F5C"><tspan x="58" y="240">O MOUNJARO</tspan></text>
  <rect x="60" y="268" width="452" height="66" fill="#8A6F5C"/>
  <text class="semi" font-size="27" letter-spacing="1.5" fill="#F2EDE6"><tspan x="84" y="311">DERRETE O SEU</tspan></text>
  <text class="serif" font-size="120" fill="#8A6F5C"><tspan x="58" y="470">ROSTO?</tspan></text>

  <!-- handle sobre a imagem -->
  <text class="semi" font-size="20" letter-spacing="1" fill="#FFFFFF" fill-opacity="0.92"><tspan x="62" y="1300">@drafrancinealmeida</tspan></text>
