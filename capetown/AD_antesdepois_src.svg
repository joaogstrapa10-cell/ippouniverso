<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style type="text/css">
      @font-face{font-family:'Playfair';src:url(data:font/ttf;base64,__FONT_SERIF__) format('truetype');font-weight:400 900;}
      @font-face{font-family:'Bodoni';src:url(data:font/ttf;base64,__FONT_BODONI__) format('truetype');font-weight:400 900;}
      @font-face{font-family:'Poppins';font-weight:400;src:url(data:font/ttf;base64,__FONT_REG__) format('truetype');}
      @font-face{font-family:'Poppins';font-weight:600;src:url(data:font/ttf;base64,__FONT_SEMI__) format('truetype');}
      .serif{font-family:'Playfair',serif;font-weight:600;}
      .mono{font-family:'Bodoni',serif;font-weight:600;font-variation-settings:'opsz' 96;}
      .reg{font-family:'Poppins',sans-serif;font-weight:400;}
      .semi{font-family:'Poppins',sans-serif;font-weight:600;}
    </style>

    <!-- leve grade premium: dessatura um toque -->
    <filter id="grade" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="saturate" values="0.92"/>
    </filter>

    <!-- vinheta: cantos escurecem ao preto -->
    <radialGradient id="vig" cx="50%" cy="44%" r="72%">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>
    <!-- scrim topo (assenta o @) -->
    <linearGradient id="scrimTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <!-- scrim base -->
    <linearGradient id="scrimBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <!-- avatar nude -->
    <radialGradient id="ava" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#E8C8BC"/>
      <stop offset="1" stop-color="#7A5C50"/>
    </radialGradient>
    <clipPath id="avaClip"><circle cx="76" cy="74" r="25"/></clipPath>
    <!-- halo escuro suave atras do monograma -->
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- fundo preto -->
  <rect width="1080" height="1350" fill="#000000"/>

  <!-- FOTO antes/depois empilhada (preenche o quadro) -->
  <image x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"
         filter="url(#grade)" xlink:href="data:image/jpeg;base64,__IMG__"/>

  <!-- tratamento preto elegante -->
  <rect width="1080" height="1350" fill="url(#vig)"/>
  <rect width="1080" height="220" fill="url(#scrimTop)"/>
  <rect y="1170" width="1080" height="180" fill="url(#scrimBot)"/>

  <!-- monograma FA ao centro (Bodoni Moda, alto contraste, sem linha branca) -->
  <g filter="url(#halo)">
    <text class="mono" font-size="104" fill="#FFFFFF" text-anchor="middle" letter-spacing="-9"><tspan x="540" y="682">FA</tspan></text>
  </g>

  <!-- @ handle (topo-esquerda) -->
  <g>
    <rect x="40" y="42" width="338" height="64" rx="32" fill="#000000" fill-opacity="0.34"/>
    <rect x="40" y="42" width="338" height="64" rx="32" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="76" cy="74" r="25" fill="#2A2A2A"/>
    <image clip-path="url(#avaClip)" x="51" y="49" width="50" height="50" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/png;base64,__AVATAR__"/>
    <circle cx="76" cy="74" r="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.5"/>
    <text class="semi" font-size="20" fill="#FFFFFF"><tspan x="114" y="81">drafrancinealmeida</tspan></text>
    <!-- selo verificado -->
    <circle cx="349" cy="74" r="11" fill="#3897F0"/>
    <path d="M344 74 l3.4 3.4 l6 -6.6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
