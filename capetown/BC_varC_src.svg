<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;display=swap');
      .sans { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <linearGradient id="goldT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9CE86"/>
      <stop offset="1" stop-color="#BE9A52"/>
    </linearGradient>
    <linearGradient id="botscrim" gradientUnits="userSpaceOnUse" x1="0" y1="470" x2="0" y2="1350">
      <stop offset="0"    stop-color="#070B0A" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#080F0D" stop-opacity="0.62"/>
      <stop offset="0.72" stop-color="#070C0B" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#050908" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="numSh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <image id="foto" x="0" y="0" width="1080" height="1350"
         xlink:href="data:image/jpeg;base64,__BC__" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1350" fill="url(#botscrim)"/>

  <!-- A10 logo top-left -->
  <image x="70" y="70" width="208" height="80"
         xlink:href="data:image/png;base64,__A10__" preserveAspectRatio="xMidYMid meet"/>

  <!-- context line -->
  <text class="sans" x="74" y="876" fill="#E0C079" font-size="23" font-weight="500" letter-spacing="5">VALORIZA&#199;&#195;O COMPROVADA EM</text>
  <text class="sans" x="72" y="930" fill="#FFFFFF" font-size="46" font-weight="700" letter-spacing="0">BALNE&#193;RIO CAMBORI&#218;</text>

  <!-- HUGE number hero -->
  <text class="sans" x="64" y="1140" fill="url(#goldT)" font-size="232" font-weight="800" letter-spacing="-4" filter="url(#numSh)">20%</text>
  <text class="sans" x="540" y="1052" fill="#FFFFFF" font-size="38" font-weight="700" letter-spacing="1">DE RESULTADO</text>
  <text class="sans" x="540" y="1098" fill="#FFFFFF" font-size="38" font-weight="700" letter-spacing="1">COMPROVADO</text>
  <text class="sans" x="542" y="1132" fill="#BBC4C2" font-size="19" font-weight="300">m&#233;dia hist&#243;rica de valoriza&#231;&#227;o do m&#178;</text>

  <text class="sans" x="74" y="1182" fill="#9BA6A4" font-size="16" font-weight="300">*Rentabilidade passada n&#227;o &#233; garantia de rentabilidade futura.</text>

  <!-- CTA + logo row -->
  <rect x="72" y="1212" width="470" height="80" rx="40" fill="url(#goldT)"/>
  <text class="sans" x="307" y="1261" text-anchor="middle" fill="#211D17" font-size="23" font-weight="700" letter-spacing="2">FALAR COM ESPECIALISTA&#160;&#160;&#8250;</text>
  <text class="sans" x="1008" y="1262" text-anchor="end" fill="#C9C2B6" font-size="18" font-weight="400" letter-spacing="2">A10EMPREENDIMENTOS.COM.BR</text>
</svg>
