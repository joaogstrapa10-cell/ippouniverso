<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&amp;family=Poppins:wght@300;400;500;600&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans  { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F2EA"/>
      <stop offset="1" stop-color="#EEE6D7"/>
    </linearGradient>
    <linearGradient id="goldT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBA967"/>
      <stop offset="1" stop-color="#9A7638"/>
    </linearGradient>
    <linearGradient id="photoFade" gradientUnits="userSpaceOnUse" x1="0" y1="690" x2="0" y2="822">
      <stop offset="0" stop-color="#F4EFE7" stop-opacity="0"/>
      <stop offset="1" stop-color="#F7F2EA" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#paper)"/>

  <!-- photo top band -->
  <image id="foto" x="0" y="0" width="1080" height="822"
         xlink:href="data:image/jpeg;base64,__BC__" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="690" width="1080" height="132" fill="url(#photoFade)"/>

  <!-- split accent: gold hairline + diamond -->
  <line x1="80" y1="822" x2="460" y2="822" stroke="#C9A86A" stroke-width="1.3" stroke-opacity="0.8"/>
  <line x1="620" y1="822" x2="1000" y2="822" stroke="#C9A86A" stroke-width="1.3" stroke-opacity="0.8"/>
  <rect x="-6" y="-6" width="12" height="12" transform="translate(540,822) rotate(45)" fill="#C9A86A"/>

  <!-- content on cream -->
  <text class="sans"  x="540" y="902"  text-anchor="middle" fill="#A9885E" font-size="22" font-weight="500" letter-spacing="8">OPORTUNIDADE EM</text>
  <text class="serif" x="540" y="996"  text-anchor="middle" fill="#2A2620" font-size="76" font-weight="600" letter-spacing="1">Balne&#225;rio Cambori&#250;</text>

  <text class="sans" x="540" y="1080" text-anchor="middle" fill="#4A443B" font-size="25" font-weight="300"><tspan fill="#A9885E" font-size="40" font-weight="600">20%</tspan>  de resultado comprovado</text>
  <text class="sans" x="540" y="1112" text-anchor="middle" fill="#8C8273" font-size="17" font-weight="300">m&#233;dia hist&#243;rica de valoriza&#231;&#227;o do m&#178; &#183; rentabilidade passada n&#227;o garante futura</text>

  <rect x="300" y="1156" width="480" height="80" rx="40" fill="#2A2620"/>
  <text class="sans" x="552" y="1205" text-anchor="middle" fill="#F4EFE7" font-size="24" font-weight="500" letter-spacing="3">FALAR COM ESPECIALISTA</text>
  <text class="sans" x="730" y="1204" text-anchor="middle" fill="#C9A86A" font-size="30" font-weight="400">&#8250;</text>

  <image x="438" y="1268" width="204" height="78"
         xlink:href="data:image/png;base64,__A10__" preserveAspectRatio="xMidYMid meet"/>
</svg>
