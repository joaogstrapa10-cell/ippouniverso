<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;family=Cormorant+Garamond:wght@500;600;700&amp;display=swap');
      .sans  { font-family: 'Poppins','Helvetica Neue',Arial,sans-serif; }
      .serif { font-family: 'Cormorant Garamond','Times New Roman',serif; }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F3EB"/>
      <stop offset="1" stop-color="#EFE6D6"/>
    </linearGradient>
    <linearGradient id="goldT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C77E"/>
      <stop offset="1" stop-color="#B5904E"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7D193"/>
      <stop offset="0.55" stop-color="#CDAB63"/>
      <stop offset="1" stop-color="#BD9A52"/>
    </linearGradient>
    <clipPath id="cSol"><rect x="72" y="176" width="452" height="672" rx="22"/></clipPath>
    <clipPath id="cBC"><rect x="556" y="556" width="452" height="292" rx="22"/></clipPath>
    <filter id="cardSh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#2A2014" flood-opacity="0.22"/>
    </filter>
    <filter id="pillSh" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#2A2014" flood-opacity="0.20"/>
    </filter>
    <filter id="ctaSh" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#2A2014" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1080" height="1350" fill="url(#paper)"/>
  <!-- thin gold frame -->
  <rect x="26" y="26" width="1028" height="1298" rx="10" fill="none" stroke="#C6AD6E" stroke-width="1" opacity="0.55"/>

  <!-- header -->
  <image x="72" y="70" width="117" height="46" xlink:href="data:image/png;base64,__A10__" preserveAspectRatio="xMidYMid meet"/>
  <text class="sans" x="1008" y="104" text-anchor="end" fill="#B5904E" font-size="20" font-weight="500" letter-spacing="2">BALNE&#193;RIO CAMBORI&#218; &#183; SC</text>
  <line x1="72" y1="140" x2="1008" y2="140" stroke="#C6AD6E" stroke-width="1" opacity="0.30"/>

  <!-- SOLENNE tall card -->
  <g filter="url(#cardSh)">
    <image clip-path="url(#cSol)" x="72" y="176" width="452" height="672"
           xlink:href="data:image/jpeg;base64,__SOLENNE__" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="72" y="176" width="452" height="672" rx="22" fill="none" stroke="#C6AD6E" stroke-width="1.5" opacity="0.7"/>
  <g filter="url(#pillSh)">
    <rect x="96" y="764" width="312" height="58" rx="29" fill="#F7F2EA"/>
  </g>
  <text class="sans" x="252" y="801" text-anchor="middle" fill="#2A2620" font-size="20" font-weight="600" letter-spacing="1">SOLENNE RESIDENCE</text>

  <!-- right column: eyebrow + title + subtitle -->
  <text class="sans" x="556" y="236" fill="#B5904E" font-size="21" font-weight="600" letter-spacing="4">INVISTA VIA SCP</text>
  <text class="serif" x="554" y="324" fill="#2A2620" font-size="68" font-weight="600">Invista na</text>
  <text class="serif" x="554" y="396" fill="#2A2620" font-size="68" font-weight="600">Incorpora&#231;&#227;o</text>
  <rect x="556" y="424" width="66" height="3" fill="url(#goldT)"/>
  <text class="sans" x="556" y="472" fill="#4A443B" font-size="23" font-weight="300">O modelo de investimento</text>
  <text class="sans" x="556" y="504" fill="#4A443B" font-size="23" font-weight="300">imobili&#225;rio inteligente.</text>

  <!-- BC aerial card -->
  <g filter="url(#cardSh)">
    <image clip-path="url(#cBC)" x="556" y="556" width="452" height="292"
           xlink:href="data:image/jpeg;base64,__BC__" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="556" y="556" width="452" height="292" rx="22" fill="none" stroke="#C6AD6E" stroke-width="1.5" opacity="0.7"/>
  <g filter="url(#pillSh)">
    <rect x="580" y="764" width="320" height="58" rx="29" fill="#F7F2EA"/>
  </g>
  <text class="sans" x="740" y="801" text-anchor="middle" fill="#2A2620" font-size="19" font-weight="600" letter-spacing="1">BALNE&#193;RIO CAMBORI&#218;</text>

  <!-- chip 1: Do terreno ao VGV (cream) -->
  <g filter="url(#pillSh)">
    <rect x="72" y="876" width="452" height="132" rx="20" fill="#FBF7F0"/>
  </g>
  <rect x="72" y="876" width="452" height="132" rx="20" fill="none" stroke="#C6AD6E" stroke-width="1" opacity="0.45"/>
  <text class="sans" x="104" y="918" fill="#B5904E" font-size="14" font-weight="600" letter-spacing="3">O MODELO</text>
  <text class="serif" x="102" y="960" fill="#2A2620" font-size="34" font-weight="600">Do terreno ao VGV</text>
  <text class="sans" x="104" y="988" fill="#8C8273" font-size="14" font-weight="300">o caminho do investimento na incorpora&#231;&#227;o</text>

  <!-- chip 2: SCP (gold) -->
  <g filter="url(#pillSh)">
    <rect x="556" y="876" width="452" height="132" rx="20" fill="url(#goldChip)"/>
  </g>
  <text class="serif" x="590" y="962" fill="#221E18" font-size="58" font-weight="700">SCP</text>
  <line x1="712" y1="902" x2="712" y2="984" stroke="#6E5E38" stroke-width="1.5" opacity="0.45"/>
  <text class="sans" x="736" y="942" fill="#2A2419" font-size="18" font-weight="500">Sociedade em Conta</text>
  <text class="sans" x="736" y="970" fill="#2A2419" font-size="18" font-weight="500">de Participa&#231;&#227;o</text>

  <!-- CTA -->
  <g filter="url(#ctaSh)">
    <rect x="72" y="1044" width="936" height="88" rx="44" fill="#2A2620"/>
  </g>
  <text class="sans" x="540" y="1097" text-anchor="middle" fill="#F4EEE2" font-size="25" font-weight="600" letter-spacing="2">FALAR COM ESPECIALISTA<tspan fill="#E2C77E" font-size="28">&#160;&#160;&#8250;</tspan></text>

  <!-- footer -->
  <text class="sans" x="540" y="1198" text-anchor="middle" fill="#B5904E" font-size="20" font-weight="500" letter-spacing="3">A10EMPREENDIMENTOS.COM.BR</text>
  <text class="sans" x="540" y="1230" text-anchor="middle" fill="#9A8F7E" font-size="14" font-weight="300" letter-spacing="1">Sociedade em Conta de Participa&#231;&#227;o &#183; invista na incorpora&#231;&#227;o</text>
</svg>
