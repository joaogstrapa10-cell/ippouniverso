<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;family=Cormorant+Garamond:wght@500;600;700&amp;display=swap');
      .sans  { font-family: 'Poppins','Helvetica Neue',Arial,sans-serif; }
      .serif { font-family: 'Cormorant Garamond','Times New Roman',serif; }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F3EB"/><stop offset="1" stop-color="#EFE6D6"/>
    </linearGradient>
    <clipPath id="cImg"><rect x="72" y="170" width="936" height="510" rx="24"/></clipPath>
    <filter id="cardSh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="13" stdDeviation="24" flood-color="#2A2014" flood-opacity="0.22"/>
    </filter>
    <filter id="smSh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2A2014" flood-opacity="0.18"/>
    </filter>
    <filter id="ctaSh" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#2A2014" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#paper)"/>
  <rect x="26" y="26" width="1028" height="1298" rx="10" fill="none" stroke="#C6AD6E" stroke-width="1" opacity="0.55"/>

  <image x="72" y="58" width="200" height="79" xlink:href="data:image/png;base64,__A10__" preserveAspectRatio="xMidYMid meet"/>
  <text class="sans" x="1008" y="112" text-anchor="end" fill="#B5904E" font-size="20" font-weight="500" letter-spacing="2">BALNE&#193;RIO CAMBORI&#218; &#183; SC</text>
  <line x1="72" y1="150" x2="1008" y2="150" stroke="#C6AD6E" stroke-width="1" opacity="0.30"/>

  <g filter="url(#cardSh)">
    <image clip-path="url(#cImg)" x="72" y="170" width="936" height="510"
           xlink:href="data:image/jpeg;base64,__IMG__" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="72" y="170" width="936" height="510" rx="24" fill="none" stroke="#C6AD6E" stroke-width="1.5" opacity="0.7"/>

  <text class="sans" x="74" y="726" fill="#B5904E" font-size="22" font-weight="600" letter-spacing="3">INVISTA NA INCORPORA&#199;&#195;O &#183; VIA SCP</text>
  <text class="serif" x="70" y="790" fill="#2A2620" font-size="60" font-weight="600">Via <tspan fill="#A9772A">SCP</tspan>, em Balne&#225;rio Cambori&#250;</text>

  <!-- 3 mechanism cards -->
  <g filter="url(#smSh)"><rect x="72"  y="852" width="290" height="200" rx="18" fill="#2A2620"/></g>
  <g filter="url(#smSh)"><rect x="395" y="852" width="290" height="200" rx="18" fill="#FBF7F0"/></g>
  <g filter="url(#smSh)"><rect x="718" y="852" width="290" height="200" rx="18" fill="#33433A"/></g>

  <text class="sans"  x="100" y="912" fill="#C9A96A" font-size="24" font-weight="700">01</text>
  <text class="serif" x="98"  y="958" fill="#F4EEE2" font-size="36" font-weight="600">S&#243;cio</text>
  <text class="sans"  x="100" y="992" fill="#CFC8BC" font-size="14" font-weight="400">da incorpora&#231;&#227;o,</text>
  <text class="sans"  x="100" y="1012" fill="#CFC8BC" font-size="14" font-weight="400">n&#227;o comprador.</text>

  <text class="sans"  x="423" y="912" fill="#B5904E" font-size="24" font-weight="700">02</text>
  <text class="serif" x="421" y="958" fill="#2A2620" font-size="30" font-weight="600">Terreno &#8594; VGV</text>
  <text class="sans"  x="423" y="992" fill="#6B6258" font-size="14" font-weight="400">voc&#234; captura cada</text>
  <text class="sans"  x="423" y="1012" fill="#6B6258" font-size="14" font-weight="400">fase do ciclo.</text>

  <text class="sans"  x="746" y="912" fill="#C9A96A" font-size="24" font-weight="700">03</text>
  <text class="serif" x="744" y="958" fill="#F4EEE2" font-size="36" font-weight="600">Antes</text>
  <text class="sans"  x="746" y="992" fill="#CBD3CC" font-size="14" font-weight="400">do lan&#231;amento</text>
  <text class="sans"  x="746" y="1012" fill="#CBD3CC" font-size="14" font-weight="400">comercial.</text>

  <g filter="url(#ctaSh)"><rect x="72" y="1098" width="580" height="94" rx="47" fill="#2A2620"/></g>
  <text class="sans" x="362" y="1155" text-anchor="middle" fill="#F4EEE2" font-size="26" font-weight="600" letter-spacing="2">FALAR COM ESPECIALISTA<tspan fill="#E2C77E" font-size="29">&#160;&#160;&#8250;</tspan></text>

  <text class="sans" x="700" y="1150" fill="#9B7528" font-size="16" font-weight="600" letter-spacing="1">SCP &#183; Sociedade em</text>
  <text class="sans" x="700" y="1172" fill="#9B7528" font-size="16" font-weight="600" letter-spacing="1">Conta de Participa&#231;&#227;o</text>
</svg>
