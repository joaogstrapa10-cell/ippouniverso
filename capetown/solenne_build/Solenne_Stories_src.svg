<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;family=Cormorant+Garamond:wght@500;600;700&amp;display=swap');
      .sans  { font-family: 'Poppins','Helvetica Neue',Arial,sans-serif; }
      .serif { font-family: 'Cormorant Garamond','Times New Roman',serif; }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F3EB"/>
      <stop offset="1" stop-color="#EFE6D6"/>
    </linearGradient>
    <linearGradient id="goldT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C77E"/>
      <stop offset="1" stop-color="#B5904E"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7D193"/>
      <stop offset="0.55" stop-color="#CDAB63"/>
      <stop offset="1" stop-color="#BD9A52"/>
    </linearGradient>
    <clipPath id="cSol"><rect x="80" y="628" width="470" height="856" rx="24"/></clipPath>
    <clipPath id="cBC"><rect x="590" y="628" width="410" height="326" rx="24"/></clipPath>
    <filter id="cardSh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#2A2014" flood-opacity="0.22"/>
    </filter>
    <filter id="pillSh" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#2A2014" flood-opacity="0.20"/>
    </filter>
    <filter id="ctaSh" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#2A2014" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#paper)"/>
  <rect x="30" y="30" width="1020" height="1860" rx="12" fill="none" stroke="#C6AD6E" stroke-width="1" opacity="0.55"/>

  <!-- header -->
  <image x="80" y="92" width="127" height="50" xlink:href="data:image/png;base64,__A10__" preserveAspectRatio="xMidYMid meet"/>
  <text class="sans" x="1000" y="132" text-anchor="end" fill="#B5904E" font-size="22" font-weight="500" letter-spacing="2">BALNE&#193;RIO CAMBORI&#218; &#183; SC</text>
  <line x1="80" y1="178" x2="1000" y2="178" stroke="#C6AD6E" stroke-width="1" opacity="0.30"/>

  <!-- eyebrow + title -->
  <text class="sans" x="82" y="272" fill="#B5904E" font-size="24" font-weight="600" letter-spacing="5">INVISTA VIA SCP</text>
  <text class="serif" x="78" y="376" fill="#2A2620" font-size="90" font-weight="600">Invista na</text>
  <text class="serif" x="78" y="468" fill="#2A2620" font-size="90" font-weight="600">Incorpora&#231;&#227;o</text>
  <rect x="82" y="502" width="82" height="4" fill="url(#goldT)"/>
  <text class="sans" x="82" y="566" fill="#4A443B" font-size="27" font-weight="300">O modelo de investimento imobili&#225;rio inteligente.</text>

  <!-- SOLENNE tall card (left) -->
  <g filter="url(#cardSh)">
    <image clip-path="url(#cSol)" x="80" y="628" width="470" height="856"
           xlink:href="data:image/jpeg;base64,__SOLENNE__" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="80" y="628" width="470" height="856" rx="24" fill="none" stroke="#C6AD6E" stroke-width="1.5" opacity="0.7"/>
  <g filter="url(#pillSh)">
    <rect x="108" y="1392" width="318" height="60" rx="30" fill="#F7F2EA"/>
  </g>
  <text class="sans" x="267" y="1430" text-anchor="middle" fill="#2A2620" font-size="21" font-weight="600" letter-spacing="1">SOLENNE RESIDENCE</text>

  <!-- BC aerial card (right top) -->
  <g filter="url(#cardSh)">
    <image clip-path="url(#cBC)" x="590" y="628" width="410" height="326"
           xlink:href="data:image/jpeg;base64,__BC__" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="590" y="628" width="410" height="326" rx="24" fill="none" stroke="#C6AD6E" stroke-width="1.5" opacity="0.7"/>
  <g filter="url(#pillSh)">
    <rect x="624" y="862" width="342" height="60" rx="30" fill="#F7F2EA"/>
  </g>
  <text class="sans" x="795" y="900" text-anchor="middle" fill="#2A2620" font-size="20" font-weight="600" letter-spacing="1">BALNE&#193;RIO CAMBORI&#218;</text>

  <!-- SCP gold chip (right mid) -->
  <g filter="url(#pillSh)">
    <rect x="590" y="986" width="410" height="232" rx="20" fill="url(#goldChip)"/>
  </g>
  <text class="serif" x="795" y="1098" text-anchor="middle" fill="#221E18" font-size="82" font-weight="700">SCP</text>
  <line x1="664" y1="1138" x2="926" y2="1138" stroke="#6E5E38" stroke-width="1.5" opacity="0.40"/>
  <text class="sans" x="795" y="1176" text-anchor="middle" fill="#2A2419" font-size="17" font-weight="500" letter-spacing="1">Sociedade em Conta de Participa&#231;&#227;o</text>

  <!-- VGV cream chip (right bottom) -->
  <g filter="url(#pillSh)">
    <rect x="590" y="1252" width="410" height="232" rx="20" fill="#FBF7F0"/>
  </g>
  <rect x="590" y="1252" width="410" height="232" rx="20" fill="none" stroke="#C6AD6E" stroke-width="1" opacity="0.45"/>
  <text class="sans" x="624" y="1318" fill="#B5904E" font-size="15" font-weight="600" letter-spacing="3">O MODELO</text>
  <text class="serif" x="622" y="1376" fill="#2A2620" font-size="44" font-weight="600">Do terreno</text>
  <text class="serif" x="622" y="1424" fill="#2A2620" font-size="44" font-weight="600">ao VGV</text>
  <text class="sans" x="624" y="1460" fill="#8C8273" font-size="15" font-weight="300">o investimento na incorpora&#231;&#227;o</text>

  <!-- CTA -->
  <g filter="url(#ctaSh)">
    <rect x="80" y="1560" width="920" height="98" rx="49" fill="#2A2620"/>
  </g>
  <text class="sans" x="540" y="1620" text-anchor="middle" fill="#F4EEE2" font-size="27" font-weight="600" letter-spacing="2">FALAR COM ESPECIALISTA<tspan fill="#E2C77E" font-size="30">&#160;&#160;&#8250;</tspan></text>

  <!-- footer -->
  <text class="sans" x="540" y="1742" text-anchor="middle" fill="#B5904E" font-size="22" font-weight="500" letter-spacing="3">A10EMPREENDIMENTOS.COM.BR</text>
  <text class="sans" x="540" y="1782" text-anchor="middle" fill="#9A8F7E" font-size="15" font-weight="300" letter-spacing="1">Sociedade em Conta de Participa&#231;&#227;o &#183; invista na incorpora&#231;&#227;o</text>
</svg>
