<title>A10 em Balneário Camboriú</title>
<link id="fontes" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@400;500;600&display=swap">
<style id="css">
/* ===== Tokens da identidade A10 (A10_PADRAO/INSTRUCOES.md) ===================
   Peça de marca única: mundo visual navy + dourado, assumido nos dois temas
   do visualizador — por isso toda cor é pintada explicitamente.            */
:root{
  --navy:#0B1624;
  --navy-card:#101B2C;
  --navy-deep:#070E18;
  --gold:#C9A86A;
  --gold-lt:#D9BC7C;
  --cream:#F5F0E6;
  --cream-soft:rgba(245,240,230,.74);
  --cream-mute:rgba(245,240,230,.46);
  --hair:rgba(201,168,106,.42);
  --hair-soft:rgba(201,168,106,.22);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Poppins','Segoe UI',system-ui,sans-serif;
  --measure:64ch;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--navy);
  color:var(--cream);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--gold-lt);outline-offset:3px}

/* ===== Estrutura ========================================================== */
.pagina{
  max-width:860px;
  margin:0 auto;
  padding:clamp(38px,6vw,76px) clamp(20px,5vw,48px) clamp(56px,8vw,96px);
  display:flex;
  flex-direction:column;
  gap:clamp(38px,5.5vw,60px);
  text-align:center;
}

/* ===== Abertura =========================================================== */
.marca{display:flex;flex-direction:column;align-items:center;gap:clamp(26px,4vw,40px)}
.marca img{width:clamp(148px,22vw,210px);height:auto;display:block}
h1{
  margin:0;
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(30px,5.4vw,50px);
  line-height:1.14;
  letter-spacing:-.005em;
  color:var(--cream);
  text-wrap:balance;
  max-width:22ch;
}

/* ===== Divisor (regra dourada curta, motivo da marca) ===================== */
.divisor{
  width:150px;height:1px;margin:0 auto;border:0;
  background:linear-gradient(90deg,rgba(201,168,106,0),var(--gold) 50%,rgba(201,168,106,0));
}

/* ===== Seções ============================================================= */
section{display:flex;flex-direction:column;align-items:center;gap:18px}
h2{
  margin:0;
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(25px,4.2vw,38px);
  line-height:1.16;
  color:var(--gold);
  text-wrap:balance;
}
p{margin:0;max-width:var(--measure);color:var(--cream-soft)}
.intro{color:var(--cream-mute);font-size:15px}

/* ===== Grade de empreendimentos =========================================== */
.portfolio{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:clamp(20px,3.2vw,30px);
  width:100%;
  margin-top:6px;
}
.slot{
  flex:0 1 calc((100% - 2 * clamp(20px,3.2vw,30px)) / 3);
  min-width:186px;
  margin:0;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.moldura{
  position:relative;
  aspect-ratio:4 / 5;              /* 1080 × 1350 — proporção Feed do padrão */
  overflow:hidden;
  background:var(--navy-card);
  border:1px solid var(--hair);
  display:grid;
  place-items:center;
}
.moldura img{
  width:100%;height:100%;
  object-fit:cover;                /* recorta para preencher, nunca estica */
  object-position:center;
  display:block;
}
/* estado vazio: fio dourado tracejado = moldura à espera da foto */
.moldura.vazio{
  border-style:dashed;
  border-color:var(--hair-soft);
  background:
    linear-gradient(180deg,rgba(201,168,106,.05),rgba(201,168,106,0) 62%),
    var(--navy-deep);
}
.moldura.vazio img{display:none}
.moldura:not(.vazio) .etiqueta{display:none}
.etiqueta{
  display:flex;flex-direction:column;gap:7px;align-items:center;
  padding:0 12px;
  font-size:9.5px;font-weight:500;line-height:1.5;
  letter-spacing:.2em;text-transform:uppercase;
  color:rgba(217,188,124,.72);
  pointer-events:none;
}
.etiqueta .medida{
  letter-spacing:.06em;text-transform:none;
  font-size:10.5px;
  color:var(--cream-mute);
}
figcaption{
  font-family:var(--serif);
  font-style:italic;
  font-weight:500;
  font-size:clamp(19px,2.4vw,23px);
  line-height:1.25;
  color:var(--cream);
}

/* ===== Envio de foto (só aparece para quem pode editar) =================== */
.enviar{display:none}
body.editavel .enviar{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:flex-end;justify-content:center;
  padding:12px;
  cursor:pointer;
  background:linear-gradient(0deg,rgba(7,14,24,.82),rgba(7,14,24,0) 58%);
  opacity:0;
  transition:opacity .18s ease;
}
body.editavel .moldura.vazio .enviar{opacity:1;background:none}
body.editavel .enviar:hover,
body.editavel .enviar:focus-within{opacity:1}
.enviar input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.enviar span{
  font-size:9.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold-lt);
  border:1px solid var(--hair);
  padding:7px 12px;
  background:rgba(7,14,24,.72);
}
.moldura.sobre{border-color:var(--gold);border-style:solid}
.moldura.ocupado{opacity:.55}

/* ===== Campo pendente (faixa de investimento) ============================= */
.campo{
  width:100%;max-width:620px;
  margin-top:10px;
  padding:22px 26px;
  border:1px dashed var(--hair-soft);
  background:rgba(16,27,44,.55);
  display:flex;flex-direction:column;gap:8px;align-items:center;
}
.campo .rotulo{
  font-size:10.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(217,188,124,.85);
}
.campo .valor{
  font-family:var(--serif);font-weight:600;font-size:clamp(21px,3vw,27px);
  color:var(--cream);line-height:1.3;
}
.campo .valor em{font-style:italic;font-weight:500;color:var(--cream-mute)}
.campo .nota{font-size:12.5px;color:var(--cream-mute)}

/* ===== Rodapé e recado do editor ========================================= */
footer{
  display:flex;flex-direction:column;gap:10px;align-items:center;
  font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(245,240,230,.34);
}
#recado{
  display:none;
  font-size:11px;letter-spacing:.1em;text-transform:none;
  color:rgba(217,188,124,.9);
}
#recado.aparece{display:block}

@media (max-width:640px){
  .slot{flex:0 1 calc((100% - clamp(20px,3.2vw,30px)) / 2);min-width:140px}
  body{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  body.editavel .enviar{transition:none}
}
</style>

<script id="logica">
/* A página é o arquivo: cada foto enviada entra recortada em 1080 × 1350 e é
   salva como uma nova versão da própria página (capacidade "artifact"), então
   quem abrir depois já vê o portfólio preenchido. Sem editor disponível
   (arquivo local, visitante sem permissão), as molduras caem para
   fotos/<slug>.jpg e, se não houver arquivo, seguem vazias. */
(function () {
  var LADO_W = 1080, LADO_H = 1350, QUALIDADE = 0.82;

  var estado = {fotos: {}};
  try { estado = JSON.parse(document.getElementById('estado').textContent) || estado; } catch (e) {}
  if (!estado.fotos) estado.fotos = {};

  var app = document.getElementById('app');
  app.appendChild(document.getElementById('fonte').content.cloneNode(true));

  var recado = document.getElementById('recado');
  function dizer(texto) {
    recado.textContent = texto || '';
    recado.classList.toggle('aparece', !!texto);
  }

  var molduras = {};
  var imagens = app.querySelectorAll('img[data-slot]');

  Array.prototype.forEach.call(imagens, function (img) {
    var slug = img.getAttribute('data-slot');
    var moldura = img.parentNode;
    molduras[slug] = moldura;
    img.addEventListener('load', function () { moldura.classList.remove('vazio'); });
    img.addEventListener('error', function () {
      img.removeAttribute('src');
      moldura.classList.add('vazio');
    });
    img.src = estado.fotos[slug] || ('fotos/' + slug + '.jpg');
  });

  /* --- recorte central em 4:5, para a foto entrar sem esticar ------------- */
  function recortar(arquivo) {
    return new Promise(function (resolve, reject) {
      var leitor = new FileReader();
      leitor.onerror = function () { reject(new Error('leitura')); };
      leitor.onload = function () {
        var im = new Image();
        im.onerror = function () { reject(new Error('imagem')); };
        im.onload = function () {
          var tela = document.createElement('canvas');
          tela.width = LADO_W; tela.height = LADO_H;
          var ctx = tela.getContext('2d');
          var escala = Math.max(LADO_W / im.width, LADO_H / im.height);
          var w = im.width * escala, h = im.height * escala;
          ctx.drawImage(im, (LADO_W - w) / 2, (LADO_H - h) / 2, w, h);
          resolve(tela.toDataURL('image/jpeg', QUALIDADE));
        };
        im.src = leitor.result;
      };
      leitor.readAsDataURL(arquivo);
    });
  }

  /* --- reconstrói o documento a partir do molde + estado ----------------- */
  function documento() {
    var abre = '<scr' + 'ipt', fecha = '</scr' + 'ipt>';
    return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">'
      + '<title>A10 em Balneário Camboriú</title>'
      + document.getElementById('fontes').outerHTML
      + document.getElementById('css').outerHTML
      + '</head><body>'
      + document.getElementById('fonte').outerHTML
      + '<div id="app"></div>'
      + abre + ' id="estado" type="application/json">' + JSON.stringify(estado) + fecha
      + abre + ' id="logica">' + document.getElementById('logica').textContent + fecha
      + '</body></html>';
  }

  /* --- editor: liga os campos de envio ----------------------------------- */
  if (!window.claude || typeof window.claude.use !== 'function') return;

  window.claude.use('artifact').then(function (editor) {
    if (!editor) return;
    document.body.classList.add('editavel');

    var pendente = null, salvando = false;

    function salvar() {
      if (salvando) { return; }
      salvando = true;
      dizer('Salvando na página…');
      editor.publish(documento()).then(function () {
        salvando = false;
        dizer('Foto salva na página.');
      }, function (erro) {
        salvando = false;
        dizer(erro && erro.code === 'conflict'
          ? 'Outra versão foi publicada antes — recarregue a página e envie de novo.'
          : 'Não deu para salvar agora. Tente novamente.');
      });
    }

    function agendar() {
      clearTimeout(pendente);
      pendente = setTimeout(salvar, 900);   /* junta envios seguidos num publish */
    }

    function receber(slug, arquivo) {
      if (!arquivo || arquivo.type.indexOf('image/') !== 0) {
        dizer('Só imagem (JPG, PNG, WEBP).');
        return;
      }
      var moldura = molduras[slug];
      moldura.classList.add('ocupado');
      recortar(arquivo).then(function (uri) {
        estado.fotos[slug] = uri;
        moldura.querySelector('img').src = uri;
        moldura.classList.remove('ocupado');
        agendar();
      }, function () {
        moldura.classList.remove('ocupado');
        dizer('Não consegui abrir essa imagem.');
      });
    }

    Array.prototype.forEach.call(app.querySelectorAll('.enviar input'), function (campo) {
      var moldura = campo.closest('.moldura');
      var slug = moldura.querySelector('img[data-slot]').getAttribute('data-slot');
      campo.addEventListener('change', function () {
        if (campo.files && campo.files[0]) receber(slug, campo.files[0]);
        campo.value = '';
      });
      ['dragenter', 'dragover'].forEach(function (ev) {
        moldura.addEventListener(ev, function (e) {
          e.preventDefault(); moldura.classList.add('sobre');
        });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        moldura.addEventListener(ev, function () { moldura.classList.remove('sobre'); });
      });
      moldura.addEventListener('drop', function (e) {
        e.preventDefault();
        var arq = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (arq) receber(slug, arq);
      });
    });

    dizer('Arraste a foto de cada empreendimento para a moldura — ela fica salva aqui.');
  });
})();
</script>
