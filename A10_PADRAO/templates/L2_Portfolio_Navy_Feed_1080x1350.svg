<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Poppins:wght@400;500;600&amp;display=swap');
      .serif{font-family:'Cormorant Garamond',serif;}
      .sans{font-family:'Poppins',sans-serif;}
    </style>
    <clipPath id="navyClip"><rect x="0" y="0" width="1080" height="1350"/></clipPath>
    <clipPath id="ph1"><rect x="64" y="556" width="301" height="494" rx="10"/></clipPath>
    <clipPath id="ph2"><rect x="389" y="556" width="301" height="494" rx="10"/></clipPath>
    <clipPath id="ph3"><rect x="714" y="556" width="301" height="494" rx="10"/></clipPath>
  </defs>

  <!-- ===== FUNDO ===== -->
  <rect width="1080" height="1350" fill="#0B1624"/>
  <g clip-path="url(#navyClip)">
    <circle cx="1040" cy="160" r="300" fill="none" stroke="#C9A86A" stroke-width="1" opacity="0.10"/>
    <circle cx="30" cy="1250" r="260" fill="none" stroke="#C9A86A" stroke-width="1" opacity="0.08"/>
  </g>

  <!-- ===== LOGO (marca dourada sobre fundo escuro) ===== -->
  <image x="460" y="52" width="160" height="63" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,@@A10_GOLD@@"/>

  <!-- ===== KICKER ===== -->
  <text class="sans" x="540" y="168" text-anchor="middle" fill="#C9A86A" font-size="21" font-weight="500" letter-spacing="4">{{KICKER}}</text>

  <!-- ===== HEADLINE (2 linhas — 2ª linha em dourado) ===== -->
  <text class="serif" x="540" y="272" text-anchor="middle" fill="#F5F0E6" font-size="92" font-weight="600">{{HEADLINE_L1}}</text>
  <text class="serif" x="540" y="374" text-anchor="middle" fill="#C9A86A" font-size="92" font-weight="600">{{HEADLINE_L2}}</text>

  <!-- ===== BODY COPY (2 linhas, palavra-chave em negrito) ===== -->
  <text class="sans" x="540" y="426" text-anchor="middle" fill="#F5F0E6" fill-opacity="0.88" font-size="25" font-weight="400">{{BODY_L1}}</text>
  <text class="sans" x="540" y="462" text-anchor="middle" fill="#F5F0E6" fill-opacity="0.88" font-size="25" font-weight="400"><tspan font-weight="600" fill-opacity="1">{{BODY_L2_BOLD}}</tspan>{{BODY_L2_REST}}</text>

  <!-- ===== LABEL "PORTFÓLIO" ===== -->
  <line x1="64" y1="518" x2="94" y2="518" stroke="#C9A86A" stroke-opacity="0.6"/>
  <text class="sans" x="106" y="524" fill="#F5F0E6" fill-opacity="0.7" font-size="15" font-weight="500" letter-spacing="2">PORTFÓLIO <tspan fill="#C9A86A" fill-opacity="1">{{MARCA}}</tspan></text>

  <!-- ===== 3 FOTOS (placeholder — remover a 3ª e redistribuir se forem só 2) ===== -->
  <g clip-path="url(#ph1)"><rect x="64" y="556" width="301" height="494" fill="#16233A"/></g>
  <rect x="64" y="556" width="301" height="494" rx="10" fill="none" stroke="#C9A86A" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
  <g transform="translate(214,780) scale(1.7)" opacity="0.55">
    <rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#C9A86A" stroke-width="2"/>
    <circle cx="-8" cy="-6" r="3" fill="none" stroke="#C9A86A" stroke-width="2"/>
    <path d="M-18 10 L-4 -2 L4 6 L10 -1 L18 10" fill="none" stroke="#C9A86A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text class="sans" x="214" y="838" text-anchor="middle" fill="#C9A86A" font-size="13.5" font-weight="500" letter-spacing="0.5">FOTO 1</text>
  <text class="sans" x="214" y="858" text-anchor="middle" fill="#C9A86A" opacity="0.7" font-size="10.5">301×494px</text>

  <g clip-path="url(#ph2)"><rect x="389" y="556" width="301" height="494" fill="#16233A"/></g>
  <rect x="389" y="556" width="301" height="494" rx="10" fill="none" stroke="#C9A86A" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
  <g transform="translate(539,780) scale(1.7)" opacity="0.55">
    <rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#C9A86A" stroke-width="2"/>
    <circle cx="-8" cy="-6" r="3" fill="none" stroke="#C9A86A" stroke-width="2"/>
    <path d="M-18 10 L-4 -2 L4 6 L10 -1 L18 10" fill="none" stroke="#C9A86A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text class="sans" x="539" y="838" text-anchor="middle" fill="#C9A86A" font-size="13.5" font-weight="500" letter-spacing="0.5">FOTO 2</text>
  <text class="sans" x="539" y="858" text-anchor="middle" fill="#C9A86A" opacity="0.7" font-size="10.5">301×494px</text>

  <g clip-path="url(#ph3)"><rect x="714" y="556" width="301" height="494" fill="#16233A"/></g>
  <rect x="714" y="556" width="301" height="494" rx="10" fill="none" stroke="#C9A86A" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
  <g transform="translate(864,780) scale(1.7)" opacity="0.55">
    <rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#C9A86A" stroke-width="2"/>
    <circle cx="-8" cy="-6" r="3" fill="none" stroke="#C9A86A" stroke-width="2"/>
    <path d="M-18 10 L-4 -2 L4 6 L10 -1 L18 10" fill="none" stroke="#C9A86A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text class="sans" x="864" y="838" text-anchor="middle" fill="#C9A86A" font-size="13.5" font-weight="500" letter-spacing="0.5">FOTO 3</text>
  <text class="sans" x="864" y="858" text-anchor="middle" fill="#C9A86A" opacity="0.7" font-size="10.5">301×494px</text>

  <!-- moldura em volta do bloco de fotos (como no Invista slide 2) -->
  <rect x="52" y="544" width="976" height="518" fill="none" stroke="#C9A86A" stroke-opacity="0.3"/>

  <!-- ===== LINHA DIVISÓRIA ===== -->
  <line x1="64" y1="1090" x2="1016" y2="1090" stroke="#C9A86A" stroke-opacity="0.22"/>

  <!-- ===== 3 STATS ===== -->
  <rect x="424" y="1116" width="1" height="70" fill="#C9A86A" opacity="0.35"/>
  <rect x="684" y="1116" width="1" height="70" fill="#C9A86A" opacity="0.35"/>

  <text class="serif" x="306" y="1162" text-anchor="middle" fill="#F5F0E6" font-size="42" font-weight="600">{{STAT1_VALOR}}</text>
  <text class="sans" x="306" y="1190" text-anchor="middle" fill="#C9A86A" fill-opacity="0.8" font-size="13" font-weight="500" letter-spacing="1.5">{{STAT1_LABEL}}</text>

  <text class="serif" x="554" y="1162" text-anchor="middle" fill="#F5F0E6" font-size="42" font-weight="600">{{STAT2_VALOR}}</text>
  <text class="sans" x="554" y="1190" text-anchor="middle" fill="#C9A86A" fill-opacity="0.8" font-size="13" font-weight="500" letter-spacing="1.5">{{STAT2_LABEL}}</text>

  <text class="serif" x="798" y="1162" text-anchor="middle" fill="#F5F0E6" font-size="34" font-weight="600">{{STAT3_VALOR}}</text>
  <text class="sans" x="798" y="1190" text-anchor="middle" fill="#C9A86A" fill-opacity="0.8" font-size="13" font-weight="500" letter-spacing="1.5">{{STAT3_LABEL}}</text>

  <!-- ===== CTA (botão sólido dourado) ===== -->
  <rect x="308" y="1224" width="464" height="72" fill="none" stroke="#C9A86A" stroke-opacity="0.6"/>
  <rect x="298" y="1214" width="464" height="72" fill="#C9A86A"/>
  <text class="sans" x="540" y="1258" text-anchor="middle" fill="#0B1624" font-size="19" font-weight="600" letter-spacing="2.5">{{CTA_TEXTO}}</text>
</svg>
