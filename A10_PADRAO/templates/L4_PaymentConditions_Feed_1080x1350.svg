<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Poppins:wght@400;500;600&amp;display=swap');
      .serif{font-family:'Cormorant Garamond',serif;}
      .sans{font-family:'Poppins',sans-serif;}
    </style>
    <clipPath id="creamClip"><rect x="0" y="0" width="1080" height="746"/></clipPath>
    <clipPath id="cardA"><rect x="64" y="444" width="464" height="272" rx="18"/></clipPath>
    <clipPath id="cardB"><rect x="552" y="444" width="464" height="272" rx="18"/></clipPath>
    <linearGradient id="capFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1624" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1624" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="ctaGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDD597"/>
      <stop offset="0.55" stop-color="#CBA65C"/>
      <stop offset="1" stop-color="#AE883D"/>
    </linearGradient>
  </defs>

  <!-- fundos -->
  <rect width="1080" height="1350" fill="#F0EBDD"/>
  <rect y="746" width="1080" height="604" fill="#0B1624"/>

  <!-- arcos decorativos -->
  <g clip-path="url(#creamClip)">
    <circle cx="1030" cy="90" r="300" fill="none" stroke="#B3913F" stroke-width="1" opacity="0.14"/>
    <circle cx="1030" cy="90" r="336" fill="none" stroke="#B3913F" stroke-width="0.7" opacity="0.10"/>
    <circle cx="40" cy="640" r="280" fill="none" stroke="#B3913F" stroke-width="1" opacity="0.10"/>
  </g>

  <!-- logos: A10 (obrigatório) + parceiro (opcional — remover se empreendimento for só A10) -->
  <image x="368" y="78" width="160" height="63" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,@@A10_GOLD@@"/>
  <image x="584" y="70" width="128" height="79" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,@@PARCEIRO_GOLD@@"/>

  <!-- kicker -->
  <text class="sans" x="540" y="212" text-anchor="middle" fill="#B3913F" font-size="19" font-weight="500" letter-spacing="3.5">{{KICKER}}</text>

  <!-- headline (2 linhas — 2ª linha com trecho em dourado) -->
  <text class="serif" x="540" y="314" text-anchor="middle" fill="#1D2C4B" font-size="92" font-weight="600">{{HEADLINE_L1}}</text>
  <text class="serif" x="540" y="410" text-anchor="middle" font-size="92" font-weight="600"><tspan fill="#1D2C4B">{{HEADLINE_L2_NAVY}}</tspan><tspan fill="#AC8A38">{{HEADLINE_L2_GOLD}}</tspan></text>

  <!-- card foto 1 (placeholder) -->
  <g clip-path="url(#cardA)"><rect x="64" y="444" width="464" height="272" fill="#DCD2B8"/></g>
  <rect x="64" y="444" width="464" height="272" rx="18" fill="none" stroke="#B3913F" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.8"/>
  <g transform="translate(296,580) scale(1.6)" opacity="0.5">
    <rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#8A7A52" stroke-width="2"/>
    <circle cx="-8" cy="-6" r="3" fill="none" stroke="#8A7A52" stroke-width="2"/>
    <path d="M-18 10 L-4 -2 L4 6 L10 -1 L18 10" fill="none" stroke="#8A7A52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text class="sans" x="296" y="640" text-anchor="middle" fill="#8A7A52" font-size="14" font-weight="500">FOTO 1 · 464×272px</text>
  <text class="serif" x="92" y="664" fill="#3A3226" font-size="44" font-weight="500" font-style="italic">{{CARD1_NOME}}</text>
  <text class="sans" x="94" y="694" fill="#6B6250" font-size="13" font-weight="500" letter-spacing="2">{{CARD1_SPECS}}</text>

  <!-- card foto 2 (placeholder) -->
  <g clip-path="url(#cardB)"><rect x="552" y="444" width="464" height="272" fill="#DCD2B8"/></g>
  <rect x="552" y="444" width="464" height="272" rx="18" fill="none" stroke="#B3913F" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.8"/>
  <g transform="translate(784,580) scale(1.6)" opacity="0.5">
    <rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#8A7A52" stroke-width="2"/>
    <circle cx="-8" cy="-6" r="3" fill="none" stroke="#8A7A52" stroke-width="2"/>
    <path d="M-18 10 L-4 -2 L4 6 L10 -1 L18 10" fill="none" stroke="#8A7A52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text class="sans" x="784" y="640" text-anchor="middle" fill="#8A7A52" font-size="14" font-weight="500">FOTO 2 · 464×272px</text>
  <text class="serif" x="580" y="664" fill="#3A3226" font-size="44" font-weight="500" font-style="italic">{{CARD2_NOME}}</text>
  <text class="sans" x="582" y="694" fill="#6B6250" font-size="13" font-weight="500" letter-spacing="2">{{CARD2_SPECS}}</text>

  <!-- nota: se houver 3º imóvel, ver instruções (layout de 3 colunas) -->

  <!-- painel navy -->
  <text class="sans" x="540" y="818" text-anchor="middle" fill="#C9A86A" font-size="22" font-weight="600" letter-spacing="5">{{PANEL_TITULO}}</text>

  <rect x="64" y="856" width="464" height="148" rx="16" fill="#101B2C" stroke="#C9A86A" stroke-opacity="0.4"/>
  <text class="sans" x="296" y="916" text-anchor="middle" fill="#C9A86A" font-size="15" font-weight="500" letter-spacing="3">{{STAT1_LABEL}}</text>
  <text class="serif" x="296" y="988" text-anchor="middle" fill="#F7F3EA" font-size="68" font-weight="600">{{STAT1_VALOR}}</text>

  <rect x="552" y="856" width="464" height="148" rx="16" fill="#101B2C" stroke="#C9A86A" stroke-opacity="0.4"/>
  <text class="sans" x="784" y="916" text-anchor="middle" fill="#C9A86A" font-size="15" font-weight="500" letter-spacing="3">{{STAT2_LABEL}}</text>
  <text class="serif" x="784" y="988" text-anchor="middle" fill="#F7F3EA" font-size="68" font-weight="600">{{STAT2_VALOR}}</text>

  <rect x="308" y="1032" width="464" height="124" rx="16" fill="#101B2C" stroke="#C9A86A" stroke-opacity="0.4"/>
  <text class="sans" x="540" y="1084" text-anchor="middle" fill="#C9A86A" font-size="15" font-weight="500" letter-spacing="3">{{STAT3_LABEL}}</text>
  <text class="serif" x="540" y="1140" text-anchor="middle" fill="#F7F3EA" font-size="48" font-weight="600">{{STAT3_VALOR}}</text>

  <!-- CTA -->
  <rect x="300" y="1206" width="500" height="74" fill="none" stroke="#C9A86A" stroke-opacity="0.55"/>
  <rect x="290" y="1196" width="500" height="74" fill="url(#ctaGold)"/>
  <text class="sans" x="540" y="1243" text-anchor="middle" fill="#0B1624" font-size="20" font-weight="600" letter-spacing="2.5">{{CTA_TEXTO}}</text>

  <!-- moldura -->
  <rect x="28" y="28" width="1024" height="1294" fill="none" stroke="#C9A86A" stroke-width="1.2" stroke-opacity="0.45"/>
</svg>
