<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Poppins:wght@400;500;600&amp;display=swap');
      .serif{font-family:'Cormorant Garamond',serif;}
      .sans{font-family:'Poppins',sans-serif;}
    </style>
    <clipPath id="creamClip"><rect x="0" y="0" width="1080" height="1920"/></clipPath>
    <clipPath id="heroClip"><rect x="188" y="560" width="704" height="1060" rx="20"/></clipPath>
  </defs>

  <!-- ===== FUNDO ===== -->
  <rect width="1080" height="1920" fill="#F0EBDD"/>
  <g clip-path="url(#creamClip)">
    <circle cx="1040" cy="180" r="300" fill="none" stroke="#B3913F" stroke-width="1" opacity="0.14"/>
    <circle cx="1040" cy="180" r="336" fill="none" stroke="#B3913F" stroke-width="0.7" opacity="0.10"/>
    <circle cx="30" cy="1800" r="260" fill="none" stroke="#B3913F" stroke-width="1" opacity="0.10"/>
  </g>

  <!-- ===== LOGO (marca escura sobre fundo claro) ===== -->
  <image x="460" y="76" width="160" height="63" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,@@A10_DARK@@"/>

  <!-- ===== KICKER ===== -->
  <text class="sans" x="540" y="192" text-anchor="middle" fill="#B3913F" font-size="21" font-weight="500" letter-spacing="4">{{KICKER}}</text>

  <!-- ===== HEADLINE (2 linhas — 2ª linha em dourado) ===== -->
  <text class="serif" x="540" y="312" text-anchor="middle" fill="#1D2C4B" font-size="92" font-weight="600">{{HEADLINE_L1}}</text>
  <text class="serif" x="540" y="414" text-anchor="middle" fill="#AC8A38" font-size="92" font-weight="600">{{HEADLINE_L2}}</text>

  <!-- ===== BODY COPY (2 linhas, palavra-chave em negrito) ===== -->
  <text class="sans" x="540" y="472" text-anchor="middle" fill="#3A3226" font-size="25" font-weight="400">{{BODY_L1}}</text>
  <text class="sans" x="540" y="508" text-anchor="middle" fill="#3A3226" font-size="25" font-weight="400"><tspan font-weight="600">{{BODY_L2_BOLD}}</tspan>{{BODY_L2_REST}}</text>

  <!-- ===== FOTO HERO (placeholder) ===== -->
  <g clip-path="url(#heroClip)">
    <rect x="188" y="560" width="704" height="1060" fill="#DCD2B8"/>
  </g>
  <rect x="188" y="560" width="704" height="1060" rx="20" fill="none" stroke="#B3913F" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.85"/>
  <g transform="translate(540,1064) scale(2.6)" opacity="0.5">
    <rect x="-18" y="-14" width="36" height="28" rx="3" fill="none" stroke="#8A7A52" stroke-width="2"/>
    <circle cx="-8" cy="-6" r="3" fill="none" stroke="#8A7A52" stroke-width="2"/>
    <path d="M-18 10 L-4 -2 L4 6 L10 -1 L18 10" fill="none" stroke="#8A7A52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text class="sans" x="540" y="1150" text-anchor="middle" fill="#8A7A52" font-size="18" font-weight="500" letter-spacing="1">FOTO — {{FOTO_LABEL}}</text>
  <text class="sans" x="540" y="1178" text-anchor="middle" fill="#8A7A52" font-size="13" font-weight="400" opacity="0.75">substituir por imagem · 704×1060px sugerido · preencher sem distorcer (slice)</text>

  <!-- ===== LINHA DIVISÓRIA ===== -->
  <line x1="188" y1="1660" x2="892" y2="1660" stroke="#B3913F" stroke-opacity="0.28"/>

  <!-- ===== 3 STATS ===== -->
  <rect x="424" y="1690" width="1" height="70" fill="#B3913F" opacity="0.4"/>
  <rect x="684" y="1690" width="1" height="70" fill="#B3913F" opacity="0.4"/>

  <text class="serif" x="306" y="1736" text-anchor="middle" fill="#1D2C4B" font-size="42" font-weight="600">{{STAT1_VALOR}}</text>
  <text class="sans" x="306" y="1764" text-anchor="middle" fill="#6B6250" font-size="13" font-weight="500" letter-spacing="1.5">{{STAT1_LABEL}}</text>

  <text class="serif" x="554" y="1736" text-anchor="middle" fill="#1D2C4B" font-size="42" font-weight="600">{{STAT2_VALOR}}</text>
  <text class="sans" x="554" y="1764" text-anchor="middle" fill="#6B6250" font-size="13" font-weight="500" letter-spacing="1.5">{{STAT2_LABEL}}</text>

  <text class="serif" x="798" y="1736" text-anchor="middle" fill="#1D2C4B" font-size="34" font-weight="600">{{STAT3_VALOR}}</text>
  <text class="sans" x="798" y="1764" text-anchor="middle" fill="#6B6250" font-size="13" font-weight="500" letter-spacing="1.5">{{STAT3_LABEL}}</text>

  <!-- ===== CTA (botão sólido navy) ===== -->
  <rect x="308" y="1808" width="464" height="72" fill="none" stroke="#B3913F" stroke-opacity="0.5"/>
  <rect x="298" y="1798" width="464" height="72" fill="#0B1624"/>
  <text class="sans" x="540" y="1842" text-anchor="middle" fill="#C9A86A" font-size="19" font-weight="600" letter-spacing="2.5">{{CTA_TEXTO}}</text>
</svg>
