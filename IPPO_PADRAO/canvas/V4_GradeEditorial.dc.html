    <span style="font-size: 17px; font-weight: 500; letter-spacing: 3.4px; color: #02D3B4; text-transform: uppercase;">Turma 18</span>
  </div>

  <!-- Título -->
  <div style="position: absolute; left: 108px; top: 944px; display: flex; flex-direction: column;">
    <span style="font-size: 34px; font-weight: 400; letter-spacing: -0.4px; color: rgba(247,250,251,0.58);">Especialização em</span>
    <h1 style="margin: 8px 0 0 0; font-size: 94px; font-weight: 600; letter-spacing: -3.2px; line-height: 0.98; color: #F7FAFB;">Implantodontia</h1>

    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#02D3B4" stroke-width="1.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="8.75"/><path d="M12 7.4V12l3.4 2.1"/>

  <p style="position: absolute; left: 108px; top: 1244px; margin: 0; font-size: 18px; font-weight: 400; color: rgba(247,250,251,0.38);">Dalton Suzuki · Filipe Polese · Julio Sawada · Jacira Signoretti · Fabrício Leite</p>
