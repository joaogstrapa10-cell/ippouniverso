</head>
<body>
<x-dc>

    <rect width="1080" height="1350" fill="url(#phbg)"/>

  <!-- Véu navy: espaço como hierarquia, não como decoração -->

  <!-- Marca -->
  <div style="position: absolute; top: 60px; left: 72px; display: flex; align-items: center; gap: 16px;">
    <svg width="46" height="54" viewBox="0 0 46 54" fill="none">
      <path d="M23 2 L43 10 V28 C43 41 34 48 23 52 C12 48 3 41 3 28 V10 Z" stroke="#02D3B4" stroke-width="2.4"/>
      <path d="M23 15 C18.5 15 15 18.2 15 22.4 C15 27.4 19.5 29.4 21 34 L21 41" stroke="#02D3B4" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="28.5" cy="22" r="4.2" stroke="#02D3B4" stroke-width="2.4"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 15px; font-weight: 400; letter-spacing: 3.4px; color: rgba(247,250,251,0.62); text-transform: lowercase;">instituto</span>
      <span style="font-size: 27px; font-weight: 800; letter-spacing: 0.6px; color: #F7FAFB; line-height: 1;">IPPO</span>

  <div style="position: absolute; left: 72px; right: 72px; bottom: 72px; display: flex; flex-direction: column; align-items: flex-start;">

    <span style="font-size: 21px; font-weight: 500; letter-spacing: 4.2px; color: #02D3B4; text-transform: uppercase;">Especialização · Turma 18</span>

    <h1 style="margin: 22px 0 0 0; font-size: 112px; font-weight: 800; letter-spacing: -3.4px; line-height: 0.96; color: #F7FAFB;">Implantodontia</h1>

    <p style="margin: 26px 0 0 0; max-width: 720px; font-size: 30px; font-weight: 400; line-height: 1.42; color: rgba(247,250,251,0.64); text-wrap: pretty;">28 meses de formação clínica ao lado de quem opera todos os dias.</p>

    <div style="width: 100%; height: 1px; margin: 44px 0 0 0; background: rgba(2,211,180,0.32);"></div>

    <!-- Especificação depois do benefício, nunca como gancho -->

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#02D3B4" stroke-width="1.5" stroke-linecap="round">

        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 14px; font-weight: 500; letter-spacing: 2.4px; color: rgba(247,250,251,0.42); text-transform: uppercase;">Início</span>
          <span style="font-size: 25px; font-weight: 500; color: #F7FAFB; line-height: 1;">Março 2027</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#02D3B4" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.75"/><path d="M12 7.4V12l3.4 2.1"/>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 14px; font-weight: 500; letter-spacing: 2.4px; color: rgba(247,250,251,0.42); text-transform: uppercase;">Duração</span>
          <span style="font-size: 25px; font-weight: 500; color: #F7FAFB; line-height: 1;">28 meses</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#02D3B4" stroke-width="1.5" stroke-linecap="round">
          <circle cx="9.4" cy="8.6" r="3.6"/><path d="M3.4 20.2c0-3.3 2.7-6 6-6s6 2.7 6 6M16.2 5.5a3.6 3.6 0 0 1 0 6.9M18.4 20.2c0-2.1-.8-4-2.2-5.2"/>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 14px; font-weight: 500; letter-spacing: 2.4px; color: rgba(247,250,251,0.42); text-transform: uppercase;">Vagas</span>
          <span style="font-size: 25px; font-weight: 500; color: #F7FAFB; line-height: 1;">Limitadas</span>

    <p style="margin: 34px 0 0 0; font-size: 20px; font-weight: 400; letter-spacing: 0.2px; color: rgba(247,250,251,0.40);">Dalton Suzuki · Filipe Polese · Julio Sawada · Jacira Signoretti · Fabrício Leite</p>
